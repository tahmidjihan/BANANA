services:
  banana:
    build: .
    image: banana:local
    container_name: banana
    working_dir: /app
    volumes:
      - ./tasks:/app/tasks:z
      - ./instances:/app/instances:z
      - ./config:/app/config:z
      - ./src:/app/src:z
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - NODE_ENV=production
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true

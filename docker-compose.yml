services:
  banana:
    build: .
    image: banana:local
    container_name: banana
    working_dir: /app
    # plug-and-play: runs GUI + Telegram in ONE container via docker-entrypoint.sh
    # volumes are optional for persistence — container works without them (copy-on-write)
    volumes:
      # persist chats, instances, creds, tasks you create — remove these lines for fully ephemeral
      - ./instances:/app/instances:z
      - ./config/creds.json:/app/config/creds.json:z
      # uncomment to persist tasks/config you create via agent:
      # - ./tasks:/app/tasks:z
      # - ./config:/app/config:z
    # creds: prefer config/creds.json (editable via UI at ⚙), fallback to .env
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PORT=4242
      - HOST=0.0.0.0
      # Ollama adapter: host ollama reachable from container (see opencode.json)
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      # set NO_TELEGRAM=1 to run GUI only
      # - NO_TELEGRAM=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4242:4242"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4242/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    stdin_open: true
    tty: true

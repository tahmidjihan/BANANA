<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANANA</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.svg">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--panel:#000;--border:#fff;--border-dim:#1a1a1a;--border-gray:#232323;--border-soft:#2a2a2a;--text:#fff;--muted:#888;--line:2px}
.mark{width:32px;height:32px;display:grid;place-items:center;border:1px solid #3f3f46;background:#f7f7f7;color:#101012;font-weight:600;box-shadow:2px 2px 0 0 #fafafa;font-family:ui-monospace,monospace;font-size:14px;line-height:1}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
button,input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#fff;border:2px solid #000}
::-webkit-scrollbar-track{background:#000;border-left:1px solid #1a1a1a}
a{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
#root{height:100vh;display:flex;overflow:hidden;background:#000;color:#fff}
/* LAYOUT */
#sidebar{width:320px;background:var(--panel);border-right:var(--line) solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
/* SIDEBAR */
.sidebar-head{padding:14px 16px;border-bottom:var(--line) solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:18px;font-weight:900;letter-spacing:0.12em;line-height:1}
.brand small{font-size:9px;letter-spacing:0.18em;color:var(--muted);display:block;margin-top:4px;font-weight:400}
.icon-btn{background:#000;border:var(--line) solid var(--border);color:var(--text);width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.icon-btn:hover{background:#fff;color:#000}
.icon-btn:active{transform:translate(1px,1px)}
.icon-btn.small{width:24px;height:24px;font-size:10px;border-width:1px}
.sidebar-section{padding:14px 16px;border-bottom:1px solid var(--border-gray);display:flex;flex-direction:column;gap:0}
.sidebar-section h2{font-size:10px;letter-spacing:0.16em;color:#fff;margin-bottom:10px;text-transform:uppercase;font-weight:900;border-left:2px solid #fff;padding-left:8px;display:flex;align-items:center;justify-content:space-between}
.task-item{font-size:12px;padding:8px 0;border-bottom:1px solid #111;display:flex;flex-direction:column;gap:3px}
.task-item:last-child{border-bottom:0}
.task-item b{font-size:12px;color:#fff;letter-spacing:0.04em;text-transform:uppercase}
.task-item span{color:#888;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instance-item{font-size:11px;color:#888;padding:5px 0;border-bottom:1px solid #111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instance-item:last-child{border-bottom:0}
 .run-item{font-size:11px;padding:5px 0;border-bottom:1px solid #111;display:flex;flex-direction:column;gap:2px}
 .run-item:last-child{border-bottom:0}
 .run-head{display:flex;align-items:center;gap:6px;color:#fff;font-weight:700}
 .run-detail{color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .fail{background:#fff;color:#000;border:1px solid #fff;padding:1px 5px;font-size:9px;letter-spacing:0.1em;font-weight:900}
 .ok-tag{border:1px solid #333;color:#888;padding:1px 5px;font-size:9px;letter-spacing:0.1em;font-weight:900}
/* CHATS - brutal */
.chats-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.chats-head h2{margin-bottom:0}
.new-chat-btn{background:#fff;color:#000;border:1px solid #fff;padding:4px 8px;font-size:10px;font-weight:900;letter-spacing:0.08em;cursor:pointer}
.new-chat-btn:hover{background:#000;color:#fff}
.chat-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.chat-item{padding:8px 10px;border:1px solid var(--border-gray);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#000;color:#fff;transition:all 0.1s}
.chat-item:hover{border-color:#555;background:#0a0a0a}
.chat-item.active{background:#fff;color:#000;border-color:#fff}
.chat-item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chat-item-title{font-size:11px;font-weight:900;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.chat-item-preview{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item.active .chat-item-preview{color:#333}
.chat-item-meta{font-size:9px;color:#555;letter-spacing:0.06em}
.chat-item.active .chat-item-meta{color:#333}
.delete-btn{background:transparent;border:1px solid #333;color:#888;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:900;flex-shrink:0}
.delete-btn:hover{border-color:#fff;color:#fff;background:#000}
.chat-item.active .delete-btn{border-color:#000;color:#000}
.chat-item.active .delete-btn:hover{background:#000;color:#fff;border-color:#000}
/* HEADER */
.header{padding:14px 16px;border-bottom:var(--line) solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#000}
.header h2{font-size:13px;letter-spacing:0.14em;font-weight:900;text-transform:uppercase}
.header small{color:#888;font-size:10px;letter-spacing:0.08em;text-transform:uppercase}
.badge{border:1px solid #fff;padding:3px 7px;font-size:10px;letter-spacing:0.1em;font-weight:900}
/* CHAT */
.chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;background:#000}
.bubble{max-width:78%;padding:14px 16px;border:1px solid var(--border-gray);font-size:13px;line-height:1.65;word-break:break-word;background:#000;color:#fff}
.bubble.user{align-self:flex-end;background:#fff;color:#000;border:1px solid #fff}
.bubble.assistant{align-self:flex-start;background:#050505;color:#fff;border:1px solid var(--border-soft)}
.bubble.assistant.thinking{border-color:#fff;border-style:dashed;animation:brutalBlink 0.9s steps(1) infinite}
@keyframes brutalBlink{0%,100%{border-color:#fff}50%{border-color:#333}}
.dots{display:inline-flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;background:#fff;border:1px solid #fff;animation:brutalPulse 0.8s steps(1) infinite}
.dot:nth-child(2){animation-delay:0.2s}.dot:nth-child(3){animation-delay:0.4s}
@keyframes brutalPulse{0%,100%{opacity:1}50%{opacity:0.15}}
.meta{font-size:10px;color:#888;margin-top:8px;letter-spacing:0.06em;text-transform:uppercase;display:flex;gap:8px;flex-wrap:wrap}
.meta span{border:1px solid #1a1a1a;padding:2px 6px}
/* MARKDOWN - brutal + gray balances */
.markdown{font-size:13px;line-height:1.65}
.markdown h1,.markdown h2,.markdown h3{font-size:13px;margin:12px 0 6px;color:#fff;letter-spacing:0.06em;text-transform:uppercase;font-weight:900;border-top:1px solid var(--border-gray);padding-top:8px}
.markdown p{margin:7px 0}
.markdown code{background:#111;border:1px solid var(--border-gray);padding:2px 6px;font-size:12px;color:#e5e5e5}
.markdown pre{background:#0a0a0a;border:1px solid var(--border-gray);padding:12px;overflow-x:auto;margin:8px 0}
.markdown pre code{background:transparent;border:0;padding:0;color:#e5e5e5}
.markdown ul,.markdown ol{margin:7px 0 7px 18px}
.markdown li{margin:3px 0}
.markdown blockquote{border-left:2px solid #333;padding-left:10px;color:#aaa;margin:8px 0;background:#050505}
.markdown a{color:#fff}
.markdown hr{border:0;border-top:1px solid var(--border-gray);margin:12px 0}
details{margin-top:10px;border:1px solid var(--border-gray)}
details summary{cursor:pointer;color:#888;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:8px 10px;list-style:none;background:#0a0a0a;border-bottom:1px solid transparent}
details[open] summary{border-bottom:1px solid var(--border-gray);background:#000;color:#fff}
details summary::-webkit-details-marker{display:none}
details pre{font-size:11px;white-space:pre-wrap;word-break:break-all;background:#000;padding:10px;max-height:280px;overflow-y:auto;border:0}
/* COMPOSER */
.composer{padding:14px 16px;border-top:1px solid var(--border-gray);display:flex;gap:10px;align-items:center;background:#000}
.composer input{flex:1;background:#0a0a0a;border:1px solid var(--border-gray);color:var(--text);padding:12px 14px;outline:none;font-size:13px}
.composer input:focus{background:#111;border-color:#333}
.composer input::placeholder{color:#555}
.composer button{background:#fff;color:#000;border:1px solid #fff;width:42px;height:42px;cursor:pointer;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.composer button:hover{background:#000;color:#fff;border-color:#fff}
.composer button:disabled{opacity:0.35;cursor:not-allowed;border-color:var(--border-gray)}
.mock{font-size:10px;color:#888;display:flex;align-items:center;gap:6px;user-select:none;letter-spacing:0.06em;text-transform:uppercase}
.mock input{accent-color:#fff}
/* SETTINGS - brutal overlay */
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.settings-panel{width:min(980px,96vw);max-height:88vh;background:#000;border:1px solid #fff;display:flex;flex-direction:column}
.settings-head{padding:12px 14px;border-bottom:var(--line) solid #fff;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;color:#000}
.settings-head h3{font-size:12px;letter-spacing:0.14em;font-weight:900;text-transform:uppercase;color:#000}
.settings-head .icon-btn{background:#000;color:#fff;border-color:#000}
.settings-head .icon-btn:hover{background:#fff;color:#000;border-color:#fff}
.settings-body{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#000}
@media(max-width:900px){.settings-body{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:8px;border:1px solid var(--border-gray);padding:12px;background:#050505}
.field label{font-size:10px;color:#fff;letter-spacing:0.1em;text-transform:uppercase;font-weight:900}
.field input,.field textarea,.field select{background:#000;border:1px solid var(--border-gray);color:#fff;padding:10px 10px;font-size:12px;outline:none;width:100%}
.field textarea{min-height:120px;resize:vertical;font-family:ui-monospace,monospace}
.field textarea.large{min-height:220px}
.field textarea:focus,.field input:focus,.field select:focus{border-color:#555;background:#0a0a0a}
.save-btn{background:#fff;color:#000;border:1px solid #fff;padding:8px 14px;font-size:11px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer}
.save-btn:hover{background:#000;color:#fff}
.save-btn:disabled{opacity:0.4}
.hint{font-size:11px;color:#888;line-height:1.5}
.hint code{border:1px solid #222;padding:1px 4px;background:#050505}
.grid-label{font-size:9px;letter-spacing:0.16em;color:#555;margin-bottom:4px}
@media(max-width:700px){#sidebar{display:none} .bubble{max-width:92%}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

function Markdown({text}){
  const html = React.useMemo(()=> {
    try{ return marked.parse(text||''); }catch{ return `<p>${text}</p>`}
  }, [text]);
  return <div className="markdown" dangerouslySetInnerHTML={{__html: html}} />;
}

function App(){
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState('');
  const [thinking,setThinking]=useState(false);
  const [tasks,setTasks]=useState([]);
  const [instances,setInstances]=useState([]);
  const [runs,setRuns]=useState([]);
  const [runSummary,setRunSummary]=useState(null);
  const [model,setModel]=useState('opencode/big-pickle');
  const [mock,setMock]=useState(false);
  const [settingsOpen,setSettingsOpen]=useState(false);
  const [creds,setCreds]=useState({});
  const [credsRaw,setCredsRaw]=useState('{}');
  const [config,setConfig]=useState({});
  const [cfgFile,setCfgFile]=useState('SOUL.md');
  const [cfgContent,setCfgContent]=useState('');
  const [chats,setChats]=useState([]);
  const [selectedChatId,setSelectedChatId]=useState(null);
  const [memoryContent,setMemoryContent]=useState('');
  const chatRef=useRef(null);

  const scrollBottom = ()=> { if(chatRef.current) chatRef.current.scrollTop=chatRef.current.scrollHeight; };
  useEffect(scrollBottom, [messages, thinking]);

  async function loadMeta(){
    try{ const r=await fetch('/api/tasks'); const j=await r.json(); setTasks(j.tasks||[]);}catch{}
    try{ const r=await fetch('/api/instances'); const j=await r.json(); setInstances(j.instances||[]);}catch{}
    try{ const r=await fetch('/api/logs?limit=12'); const j=await r.json(); setRuns(j.runs||[]); setRunSummary(j.summary||null);}catch{}
    try{ const r=await fetch('/api/health'); const j=await r.json(); setModel(j.model||model);}catch{}
  }

  async function loadChats(){
    try{
      const r=await fetch('/api/chats'); const j=await r.json();
      const list=j.chats||[];
      setChats(list);
      if(!selectedChatId && list.length){
        // select most recent
        selectChat(list[0].id);
      } else if(!list.length){
        // create first chat
        createChat();
      } else if(selectedChatId){
        // refresh selected chat messages
        const cur=list.find(c=>c.id===selectedChatId);
        if(cur) loadChat(cur.id);
      }
    }catch{}
  }

  async function loadChat(chatId){
    try{
      const r=await fetch(`/api/chats/${chatId}`); const j=await r.json();
      if(j.chat){
        const msgs=j.chat.messages||[];
        // map to UI messages
        const uiMsgs=msgs.length? msgs.map(m=>({role:m.role,text:m.text,meta:m.result?{task:m.result.task,status:m.result.status}:null})) : [{role:'assistant',text:'**BANANA**\n\nNew chat — try `hi`, `run echo-demo hello`, `create task ...`'}];
        setMessages(uiMsgs);
        setSelectedChatId(chatId);
      }
    }catch{}
  }

  async function createChat(){
    try{
      const r=await fetch('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'New Chat'})});
      const j=await r.json();
      if(j.chat){
        await loadChats();
        setSelectedChatId(j.chat.id);
        setMessages([{role:'assistant',text:'**BANANA**\n\nNew chat created. Agent is aware of this chat context. Try `hi` or `run echo-demo hello`.'}]);
      }
    }catch{}
  }

  async function deleteChat(chatId, e){
    if(e) e.stopPropagation();
    if(!confirm('DELETE CHAT?')) return;
    try{
      const r=await fetch(`/api/chats/${chatId}`,{method:'DELETE'});
      const j=await r.json();
      if(j.ok){
        const remaining=chats.filter(c=>c.id!==chatId);
        setChats(remaining);
        if(selectedChatId===chatId){
          if(remaining.length) loadChat(remaining[0].id);
          else createChat();
        } else loadChats();
      }
    }catch{}
  }

  async function selectChat(chatId){
    setSelectedChatId(chatId);
    await loadChat(chatId);
  }

  useEffect(()=>{ loadMeta(); loadChats(); const id=setInterval(()=>{loadMeta(); loadChats();},5000); return ()=>clearInterval(id); },[]);

  async function openSettings(){
    setSettingsOpen(true);
    try{
      const r=await fetch('/api/creds'); const j=await r.json();
      setCreds(j.creds||{}); setCredsRaw(JSON.stringify(j.creds||{},null,2));
    }catch{}
    try{
      const r=await fetch('/api/config'); const j=await r.json();
      setConfig(j.config||{}); setCfgContent((j.config||{})[cfgFile]||'');
    }catch{}
    try{
      const r=await fetch('/api/memory'); const j=await r.json();
      setMemoryContent(j.memory||'');
    }catch{}
  }
  useEffect(()=>{
    if(config[cfgFile]!==undefined) setCfgContent(config[cfgFile]||'');
  },[cfgFile]);

  async function saveCreds(){
    try{
      const obj=JSON.parse(credsRaw);
      const r=await fetch('/api/creds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
      const j=await r.json();
      if(j.ok){ setCreds(j.creds); setModel(j.creds.OPENCODE_MODEL||model); alert('CREDS SAVED'); } else alert(j.error||'failed');
    }catch(e){ alert('INVALID JSON: '+e.message); }
  }
  async function saveConfig(){
    const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:cfgFile,content:cfgContent})});
    const j=await r.json();
    if(j.ok){ alert(cfgFile+' SAVED — NEXT TURN USES NEW PROMPT'); const nr=await fetch('/api/config'); const nj=await nr.json(); setConfig(nj.config||{});} else alert(j.error);
  }
  async function saveMemory(){
    const r=await fetch('/api/memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:memoryContent})});
    const j=await r.json();
    if(j.ok) alert('MEMORY SAVED — NEXT PROMPT WILL USE IT'); else alert(j.error);
  }

  async function send(){
    const text=input.trim(); if(!text || !selectedChatId) return;
    // optimistic user
    setMessages(m=>[...m,{role:'user',text}]); setInput(''); setThinking(true);
    try{
      const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mock,chat_id:selectedChatId})});
      const j=await r.json();
      const out=j.output || j.error || JSON.stringify(j,null,2);
      setMessages(m=>[...m,{role:'assistant',text:out, meta:j, raw:j.cli_raw}]);
      // update chat preview via reload
      loadChats();
    }catch(e){
      setMessages(m=>[...m,{role:'assistant',text:'ERROR: '+e.message}]);
    }
    setThinking(false); loadMeta();
  }

  const selectedChat = chats.find(c=>c.id===selectedChatId);

  return (
    <div id="root" style={{display:'flex',height:'100vh',width:'100vw'}}>
      <aside id="sidebar">
        <div className="sidebar-head">
          <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
            <div className="mark">B</div>
            <div>
              <div className="brand">BANANA</div>
              <small style={{fontSize:'10px',letterSpacing:'0.08em',color:'#888',marginTop:'2px',display:'block'}}>AUTOMATION — MINIMAL</small>
            </div>
          </div>
          <button className="icon-btn" onClick={openSettings} title="SETTINGS">⚙</button>
        </div>

        <div className="sidebar-section">
          <div className="chats-head">
            <h2>CHATS — {chats.length}</h2>
            <button className="new-chat-btn" onClick={createChat}>+ NEW</button>
          </div>
          <div className="chat-list">
            {chats.length? chats.map(c=> (
              <div key={c.id} className={`chat-item ${c.id===selectedChatId?'active':''}`} onClick={()=>selectChat(c.id)}>
                <div className="chat-item-main">
                  <div className="chat-item-title">{c.title}</div>
                  <div className="chat-item-preview">{c.preview || '—'}</div>
                  <div className="chat-item-meta">{c.message_count} MSG · {c.updated_at?.slice(0,10)}</div>
                </div>
                <button className="delete-btn" onClick={(e)=>deleteChat(c.id,e)} title="delete">✕</button>
              </div>
            )) : <span style={{color:'#333',fontSize:'11px'}}>— NO CHATS —</span>}
          </div>
          <div className="hint" style={{marginTop:'8px',fontSize:'10px'}}>AGENT AWARE OF CURRENT CHAT — CAN CREATE/DELETE VIA `instances/chats/`</div>
        </div>

        <div className="sidebar-section">
          <h2>TASKS — {tasks.length}</h2>
          <div>{tasks.length? tasks.map(t=> <div key={t.name} className="task-item"><b>{t.name}</b><span>{t.readme.split('\n')[0].slice(0,80) || '—'}</span></div>) : <span style={{color:'#333',fontSize:'11px'}}>— NONE —</span>}</div>
        </div>
        <div className="sidebar-section">
          <h2>INSTANCES</h2>
          <div>{instances.slice(0,6).map(i=> (
            <div key={i.id} className="instance-item" style={{display:'flex',alignItems:'center',gap:'6px'}}>
              {i.error_kind && i.error_kind!=='ok' && <span className="fail">{i.error_kind}</span>}
              <span style={{overflow:'hidden',textOverflow:'ellipsis'}}>{i.id.slice(0,8)} · {(i.given?.text||'').slice(0,22)} → {(i.result?.output||'').slice(0,22)}</span>
            </div>
          ))}
          {instances.length===0 && <span style={{color:'#333',fontSize:'11px'}}>— EMPTY —</span>}</div>
        </div>

        <div className="sidebar-section">
          <h2>RUNS{runSummary? ` — ${runSummary.failed} FAILED / ${runSummary.total}` : ''}</h2>
          <div>{runs.slice(0,8).map((r,i)=> (
            <div key={i} className="run-item">
              <div className="run-head">
                <span className={r.status==='ok' ? 'ok-tag' : 'fail'}>{r.status==='ok' ? 'OK' : (r.error_kind||'ERR').toUpperCase()}</span>
                <span>{r.task||'—'}</span>
                {r.attempt>1 && <span className="ok-tag">×{r.attempt}</span>}
                <span style={{marginLeft:'auto',color:'#555',fontWeight:400}}>{r.duration_ms}ms</span>
              </div>
              {r.error && <div className="run-detail" title={r.error}>{(r.error||'').split('\n')[0].slice(0,34)}</div>}
            </div>
          ))}
          {!runs.length && <span style={{color:'#333',fontSize:'11px'}}>— NO RUNS —</span>}</div>
        </div>
        <div className="sidebar-section">
          <h2>MODEL</h2>
          <div style={{fontSize:'11px',color:'#fff',wordBreak:'break-all',border:'1px solid #111',padding:'6px 8px',background:'#050505'}}>{model}</div>
          <label className="mock" style={{marginTop:'10px'}}><input type="checkbox" checked={mock} onChange={e=>setMock(e.target.checked)} /> USE --MOCK</label>
          <div className="hint" style={{marginTop:'10px',borderTop:'1px solid #111',paddingTop:'8px'}}>AGENT EDITS <code>config/*.md</code> + <code>tasks/*</code> + <code>creds.json</code> + <code>chats</code> ON ASK.</div>
        </div>
        <div style={{flex:1,borderTop:'1px solid #111'}} />
        <div className="sidebar-section" style={{borderBottom:'0',background:'#fff',color:'#000'}}>
          <div style={{fontSize:'10px',fontWeight:900,letterSpacing:'0.12em'}}>BLACK / WHITE / BORDERS</div>
          <div style={{fontSize:'10px',color:'#333'}}>2PX SOLID · 0 RADIUS · MONOSPACE</div>
        </div>
      </aside>

      <main id="main">
        <div className="header">
          <div className="header-left"><h2>{selectedChat?.title?.toUpperCase() || 'DASHBOARD'}</h2><small>→ /BRUTAL-MINIMALIST-DESIGN {selectedChatId? `· ${selectedChatId.slice(0,8)}` : ''}</small></div>
          <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
            <span className="badge">{model.split('/').pop()}</span>
            <button className="icon-btn" onClick={openSettings}>≡</button>
          </div>
        </div>

        <div className="chat" ref={chatRef}>
          {messages.map((m,i)=> (
            <div key={i} className={`bubble ${m.role}`}>
              {m.role==='assistant' ? <Markdown text={m.text}/> : <div style={{whiteSpace:'pre-wrap',fontWeight:700}}>{m.text}</div>}
              {m.meta && <div className="meta"><span>TASK:{m.meta.task||'—'}</span><span>{m.meta.status}</span>{m.meta.error_kind && m.meta.error_kind!=='ok' && <span className="fail">{m.meta.error_kind}</span>}{m.meta.attempts>1 && <span>RETRIED ×{m.meta.attempts}</span>}<span>{m.meta.instance?.split('/').pop().slice(0,8)}</span>{m.meta.chat_id && <span>CHAT:{m.meta.chat_id.slice(0,8)}</span>}</div>}
              {m.meta && m.meta.error && <details><summary>ERROR — {(m.meta.error||'').split('\n')[0].slice(0,60)}</summary><pre>{(m.meta.error||'').slice(0,2000)}</pre></details>}
              {m.raw && <details><summary>TRACE — RAW</summary><pre>{m.raw.slice(0,4000)}</pre></details>}
            </div>
          ))}
          {thinking && <div className="bubble assistant thinking" style={{display:'flex',alignItems:'center',gap:'10px'}}><span style={{fontSize:'11px',letterSpacing:'0.12em',fontWeight:900}}>GENERATING</span><span className="dots"><span className="dot"/><span className="dot"/><span className="dot"/></span></div>}
        </div>

        <div className="composer">
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder={selectedChatId? `MESSAGE — ${selectedChat?.title || 'CHAT'}…` : "SELECT OR CREATE CHAT…"} disabled={!selectedChatId} />
          <button onClick={send} disabled={thinking || !input.trim() || !selectedChatId}>↑</button>
        </div>
      </main>

      {settingsOpen && (
        <div className="settings-overlay" onClick={e=>{ if(e.target===e.currentTarget) setSettingsOpen(false); }}>
          <div className="settings-panel">
            <div className="settings-head">
              <h3>SETTINGS — CREDS.JSON + CONFIG/*.MD</h3>
              <button className="icon-btn" onClick={()=>setSettingsOpen(false)}>✕</button>
            </div>
            <div className="settings-body">
              <div className="field">
                <label>CONFIG/CREDS.JSON — EDITABLE CREDS</label>
                <textarea className="large" value={credsRaw} onChange={e=>setCredsRaw(e.target.value)} spellCheck={false} />
                <div style={{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}}>
                  <button className="save-btn" onClick={saveCreds}>SAVE CREDS.JSON</button>
                  <span className="hint">OPENCODE_MODEL · TELEGRAM_BOT_TOKEN — AGENT ALSO EDITS VIA CHAT</span>
                </div>
              </div>

              <div className="field">
                <label>CONFIG/*.MD — SELF-EDITABLE PROMPTS</label>
                <select value={cfgFile} onChange={e=>setCfgFile(e.target.value)}>
                  {Object.keys(config).map(k=> <option key={k} value={k}>{k}</option>)}
                </select>
                <textarea className="large" value={cfgContent} onChange={e=>setCfgContent(e.target.value)} spellCheck={false} style={{minHeight:'320px'}} />
                <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
                  <button className="save-btn" onClick={saveConfig}>SAVE {cfgFile}</button>
                  <span className="hint">VIA CHAT: “EDIT SOUL.MD TO …” — WRITES FILE</span>
                </div>
                <div className="hint">REPO WRITES ALLOWED: <code>config/</code> <code>tasks/</code> <code>src/</code> <code>instances/chats/</code> — OPENS WITH --AUTO</div>
              </div>

              <div className="field" style={{gridColumn:'1 / -1'}}>
                <label>MEMORY.MD — RECENT MEMORIES (AUTO-UPDATED, EDITABLE)</label>
                <textarea className="large" value={memoryContent} onChange={e=>setMemoryContent(e.target.value)} spellCheck={false} style={{minHeight:'320px'}} />
                <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
                  <button className="save-btn" onClick={saveMemory}>SAVE MEMORY.MD</button>
                  <span className="hint">Stores: User, how to run tasks, recent topics & task runs. Agent reads every prompt. Also editable via chat: “remember …”</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
